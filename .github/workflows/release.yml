# On every push to main: tag the pushed commit with the next patch version and
# publish a GitHub release for it. main only takes changes through pull requests,
# so nothing is committed back; package.json's version is only a floor — bump it
# in a PR (e.g. to 0.2.0) to jump ahead, otherwise the latest tag's patch goes up.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Pick the next version
        id: version
        run: |
          package="$(node -p "require('./package.json').version")"
          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sed 's/^v//' | sort -V | tail -n1)"
          if [ -z "$latest" ] || [ "$(printf '%s\n%s\n' "$latest" "$package" | sort -V | tail -n1)" != "$latest" ]; then
            next="$package"
          else
            IFS=. read -r major minor patch <<< "$latest"
            next="$major.$minor.$((patch + 1))"
          fi
          echo "version=v$next" >> "$GITHUB_OUTPUT"

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.version.outputs.version }}" --target "$GITHUB_SHA" --title "${{ steps.version.outputs.version }}" --generate-notes
